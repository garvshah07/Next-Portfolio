<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyan/Indigo Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle (rounded 112px on 512px canvas) -->
  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Ambient Glow behind letters -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientGlow)" />

  <!-- Premium Sleek Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner subtle border glow -->
  <rect x="36" y="36" width="440" height="440" rx="98" ry="98" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Center Monogram "GS" with cyber-clean geometric paths -->
  <g filter="url(#subtleGlow)">
    <!-- Letter G -->
    <path 
      d="M 230 176 
         C 200 156, 155 160, 134 195 
         C 112 230, 112 282, 134 317 
         C 155 352, 202 356, 230 334 
         C 246 322, 252 305, 252 284 
         L 202 284" 
      fill="none" 
      stroke="url(#brandGrad)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Letter S -->
    <path 
      d="M 378 190 
         C 362 166, 332 158, 305 168 
         C 278 178, 270 206, 282 228 
         C 292 246, 320 256, 342 266 
         C 372 280, 388 302, 380 328 
         C 370 354, 334 362, 300 352 
         C 280 346, 268 334, 260 322" 
      fill="none" 
      stroke="url(#brandGrad)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Modern accent dot / spark in top right of G -->
  <circle cx="250" cy="176" r="6" fill="#38bdf8" opacity="0.9" />
</svg>